name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-desktop-frontend:
    name: Build desktop frontend
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build frontend assets
        run: yarn build:desktop-frontend

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend
          path: frontend/dist/frontend/browser/**
          if-no-files-found: error
          retention-days: 1

  publish-tauri:
    needs: build-desktop-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust and Tauri build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/tauri
            software/tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('software/tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Download prebuilt frontend
        uses: actions/download-artifact@v4
        with:
          name: desktop-frontend
          path: frontend/dist/frontend/browser

      - name: Prepare updater signing key
        shell: bash
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const secret = process.env.SIGNING_PRIVATE_KEY?.trim();
          if (!secret) {
            console.error('TAURI_SIGNING_PRIVATE_KEY não foi configurada.');
            process.exit(1);
          }

          const isRawKey = /^untrusted comment:/m.test(secret);
          const encodedKey = isRawKey ? Buffer.from(secret, 'utf8').toString('base64') : secret.replace(/\s+/g, '');
          let decoded = secret;
          if (!isRawKey) {
            try {
              decoded = Buffer.from(encodedKey, 'base64').toString('utf8');
            } catch {
              decoded = '';
            }
          }

          if (!/^untrusted comment:.*secret key/m.test(decoded)) {
            console.error(
              'TAURI_SIGNING_PRIVATE_KEY não contém uma chave privada do Tauri válida.',
            );
            process.exit(1);
          }

          const keyPath = path.join(process.env.RUNNER_TEMP, 'fast-drive-updater.key');
          fs.writeFileSync(keyPath, encodedKey, { mode: 0o600 });
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `TAURI_SIGNING_PRIVATE_KEY_PATH=${keyPath}\nTAURI_SIGNING_PRIVATE_KEY=${encodedKey}\n`,
          );
          NODE

      - name: Configure updater endpoint
        run: yarn --cwd software configure-updater

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "1"
          FAST_DRIVE_SKIP_FRONTEND_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: software
          tauriScript: yarn tauri
          tagName: desktop-v__VERSION__
          releaseName: Fast Drive v__VERSION__
          releaseBody: "Baixe o instalador correspondente ao seu sistema operacional."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
