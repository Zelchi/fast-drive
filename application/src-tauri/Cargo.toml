[package]
name = "fast-drive"
version = "0.1.4"
description = "Fast Drive desktop application"
authors = ["Fast Drive"]
edition = "2021"

[lib]
name = "fast_drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
